# ─────────────────────────────────────────────────────────────────────────────
# FORWARD THE OLD NETLIFY ADDRESS TO GITHUB PAGES
#
# Use this ONLY after https://antanij.github.io is live and looks right.
# Then: delete netlify.toml, rename this file to netlify.toml, commit and push.
# From then on, every https://antanij.netlify.app/<anything> link permanently
# redirects to https://antanij.github.io/<same path>.
# Keep the Netlify site itself (don't delete it), or the old links stop working.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Nothing to build: Netlify only serves the redirects below.
  command = "mkdir -p public && echo 'Moved to https://antanij.github.io' > public/index.html"
  publish = "public"

# Old protocol file locations
[[redirects]]
  from = "/protocols/phage_fluorescent_labeling.txt"
  to = "https://antanij.github.io/protocols/phage_fluorescent_labeling/"
  status = 301
  force = true

[[redirects]]
  from = "/media/antani_phage_labeling_protocol.txt"
  to = "https://antanij.github.io/protocols/phage_fluorescent_labeling/"
  status = 301
  force = true

# PDFs: Netlify matches these case-insensitively, so old links like
# /media/cv_jantani.pdf still reach the correctly capitalised file on GitHub Pages
# (GitHub Pages itself is case-sensitive).
[[redirects]]
